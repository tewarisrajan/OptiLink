[project]
name = "optilink"
version = "0.1.0"
description = "OptiLink"
requires-python = ">=3.12"

dependencies = [
    "opencv-python-headless>=4.8.0",
    "cryptography>=41.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "reedsolo>=1.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[tool.vercel]
entrypoint = "optilink.server.app:app"